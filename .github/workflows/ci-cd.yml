name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Run Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall app

      - name: API smoke check
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          body = response.json()
          assert body.get("status") == "ok", body
          print(body)
          PY

  deploy:
    name: Auto Deploy
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DEPLOY_WEBHOOK_URL != ''

    steps:
      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl --fail --show-error --silent -X POST "$DEPLOY_WEBHOOK_URL" || \
          curl --fail --show-error --silent "$DEPLOY_WEBHOOK_URL"
          echo "Deploy hook triggered."
